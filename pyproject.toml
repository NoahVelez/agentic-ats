[project]
name = "agentic-ats"
version = "0.1.0"
description = "Agentic ATS class project (synthetic data only, not for real hiring decisions)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "faker>=30.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Providers for the synthetic data generator (DATAGEN_LLM_PROVIDER).
datagen-llm = [
    "openai>=1.40",
    "anthropic>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
