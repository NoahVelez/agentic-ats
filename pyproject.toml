
[project]
name = "agentic-ats"
version = "0.1.0"
description = "Agentic ATS class project (synthetic data only, not for real hiring decisions)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "faker>=30.0",
    "rank-bm25>=0.2.2",
    "fastmcp>=2,<3",
    "chromadb>=1.5.9",
    "fastapi>=0.163.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "fastembed>=0.9.1",
    "openai>=1.40",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
# Providers for the synthetic data generator (DATAGEN_LLM_PROVIDER).
datagen-llm = [
    "anthropic>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not slow'"
markers = [
    "slow: loads the real embedding model and downloads it on first use (run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
