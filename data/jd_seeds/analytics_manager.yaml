job_id: jd_analytics_mgr
title: Analytics Manager
field: analytics
text: |
  # Analytics Manager

  **Team:** Business Analytics · **Location:** Hybrid (Chicago, IL) · **Reports to:** Director of Data

  ## About the role
  We are looking for an Analytics Manager to lead a team of analysts who support product, marketing,
  and finance. You will own our reporting layer, run our experimentation program, and turn data into
  decisions that executives act on.

  ## What you'll do
  - Lead, hire, and develop a team of 4-6 analysts; run 1:1s, set goals, and own performance reviews.
  - Write and review complex SQL against our relational databases and cloud data warehouse.
  - Build and maintain dashboards in Tableau or Power BI that leaders use every week.
  - Design A/B tests, size samples, and report results with statistical significance.
  - Communicate insights to stakeholders and deliver executive presentations on business performance.
  - Partner with data engineering on data models in Snowflake, BigQuery, or Redshift.

  ## Must have
  - 3+ years of people management experience with direct reports.
  - Advanced SQL skills.
  - Experience building dashboards and data visualization in Tableau or Power BI.
  - Hands-on experience with A/B testing and experimentation, including hypothesis testing.
  - Strong stakeholder communication, including executive presentations and data storytelling.

  ## Nice to have
  - Python (pandas, Jupyter) or R programming for analysis.
  - Experience with a cloud data warehouse such as Snowflake, BigQuery, or Redshift.

  *Synthetic job description for a class project. Not a real job posting.*

